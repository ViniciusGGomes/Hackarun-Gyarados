services:
  postgres:
    image: bitnami/postgresql:latest
    container_name: hackathon-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=docker
      - POSTGRESQL_DATABASE=hackathon
    volumes:
      - postgres_data_hackathon:/bitnami/postgresql

volumes:
  postgres_data_hackathon:
